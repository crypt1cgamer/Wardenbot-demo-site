<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OrderFlow | Business Settings</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div>
      <h1>Business Settings</h1>
      <p>Tax, payments, and business information</p>
    </div>

    <div class="header-actions">
      <a class="small-btn" href="manager.html">Manager Dashboard</a>
      <button class="small-btn danger" onclick="logout()">Logout</button>
    </div>
  </div>
</header>

<main class="container auth-container">
  <section class="auth-card">
    <h2>Business Setup</h2>
    <p class="muted-text">These settings are saved locally for the demo.</p>

    <form id="businessSettingsForm">
      <label class="form-label">
        Business Name
        <input type="text" id="businessName" placeholder="CALI Street Tacos" required />
      </label>

      <label class="form-label">
        PayPal Email
        <input type="email" id="paypalEmail" placeholder="payments@example.com" />
      </label>

      <label class="form-label">
        Sales Tax Rate (%)
        <input type="number" id="taxRate" step="0.01" min="0" placeholder="6.5" required />
      </label>

      <label class="form-label checkbox-label">
        <input type="checkbox" id="allowPayAtPickup" />
        Allow Pay at Pickup
      </label>

      <label class="form-label checkbox-label">
        <input type="checkbox" id="allowPayPal" />
        Allow PayPal Payments
      </label>

      <button class="submit-btn" type="submit">Save Settings</button>
    </form>

    <p id="settingsMessage" class="muted-text" style="margin-top:12px;"></p>
  </section>
</main>

<footer>
  OrderFlow Systems Business Settings
</footer>

<script src="js/auth-check.js"></script>
<script src="js/business-settings.js"></script>

</body>
</html>
